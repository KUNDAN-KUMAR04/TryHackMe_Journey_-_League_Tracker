<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TryHackMe Journey Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            thmGreen: '#10b981',
            thmDark: '#0f172a',
            thmCard: '#1e293b',
            thmBorder: '#334155'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-thmDark text-slate-100 min-h-screen font-sans">
  
  <!-- Header -->
  <header class="border-b border-thmBorder bg-slate-900/80 sticky top-0 backdrop-blur z-20 px-6 py-4">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="p-2 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xl font-mono">
          <i class="fa-solid fa-terminal"></i>
        </span>
        <div>
          <h1 class="text-xl font-bold tracking-wide">TryHackMe Journey Directory</h1>
          <p class="text-xs text-slate-400">Track competitor & peer profiles dynamically</p>
        </div>
      </div>

      <!-- Quick Counter & Live Search -->
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <div class="relative flex-1 sm:w-64">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search username, rank..." 
            class="w-full pl-9 pr-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:border-emerald-500 text-white"
          />
        </div>
        <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-mono">
          Total: <span id="userCount" class="text-emerald-400 font-bold">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-6 py-8">
    <div id="loading" class="text-center py-16 text-slate-400">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl text-emerald-400 mb-3"></i>
      <p>Loading users from users.json...</p>
    </div>

    <!-- Cards Grid -->
    <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 hidden"></div>
  </main>

  <script>
    const baseUrl = "https://tryhackme.com/p/";
    let allUsers = [];

    async function loadData() {
      const loadingEl = document.getElementById("loading");
      const grid = document.getElementById("cardsGrid");
      const countEl = document.getElementById("userCount");

      try {
        const response = await fetch("./users.json");
        if (!response.ok) throw new Error("Could not load users.json");
        allUsers = await response.json();
      } catch (err) {
        console.warn("Falling back to local fallback / empty state", err);
        allUsers = [];
      }

      loadingEl.classList.add("hidden");
      grid.classList.remove("hidden");
      renderUsers(allUsers);
    }

    function renderUsers(list) {
      const grid = document.getElementById("cardsGrid");
      const countEl = document.getElementById("userCount");
      countEl.textContent = list.length;
      grid.innerHTML = "";

      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-12">No users found.</div>`;
        return;
      }

      list.forEach((u, index) => {
        const profileUrl = baseUrl + encodeURIComponent(u.username);
        const card = document.createElement("div");
        card.className = "bg-thmCard border border-thmBorder hover:border-emerald-500/50 rounded-xl p-4 transition-all duration-200 hover:-translate-y-1 hover:shadow-lg flex flex-col justify-between";

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-mono px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-400">
                #${u.rank || (index + 1)}
              </span>
              ${u.badge ? `<span class="text-[10px] font-bold tracking-wider px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">${u.badge}</span>` : ''}
            </div>

            <h3 class="font-bold text-base text-white truncate title="${u.username}">
              ${u.username}
            </h3>

            ${u.points ? `
              <p class="text-xs text-slate-400 mt-1">
                <i class="fa-solid fa-fire text-amber-500 mr-1"></i>${u.points} Points
              </p>
            ` : ''}
          </div>

          <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between gap-2">
            <a 
              href="${profileUrl}" 
              target="_blank" 
              rel="noopener noreferrer" 
              class="flex-1 inline-flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold px-3 py-1.5 rounded-lg text-xs transition-colors"
            >
              <span>View Profile</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
            <button 
              onclick="copyLink('${profileUrl}', this)" 
              class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs border border-slate-700 transition" 
              title="Copy Profile URL"
            >
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function copyLink(url, btn) {
      navigator.clipboard.writeText(url).then(() => {
        const oldHtml = btn.innerHTML;
        btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i>`;
        setTimeout(() => btn.innerHTML = oldHtml, 1500);
      });
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = allUsers.filter(u => 
        u.username.toLowerCase().includes(q) || 
        (u.badge && u.badge.toLowerCase().includes(q)) ||
        (u.rank && u.rank.toString().includes(q))
      );
      renderUsers(filtered);
    });

    loadData();
  </script>
</body>
</html>
