<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TryHackMe Leaderboards & Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Source+Sans+Pro:wght@400;600;700&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            thmBg: '#151c2b',
            thmCard: '#1c2538',
            thmCardLight: '#212c42',
            thmBorder: '#2c323e',
            thmGreen: '#a3ea2a',
            thmGreenDark: '#26890c',
            thmTextMuted: '#878fa2'
          },
          fontFamily: {
            ubuntu: ['Ubuntu', 'sans-serif'],
            sans: ['Source Sans Pro', 'sans-serif'],
            mono: ['Fira Code', 'monospace']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-thmBg text-slate-100 min-h-screen font-sans flex flex-col justify-between">

  <!-- Main App Shell -->
  <div>
    <!-- Top Nav Header -->
    <header class="bg-[#1c2538] border-b border-thmBorder sticky top-0 z-30 px-4 py-3 shadow-md">
      <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
        
        <!-- Logo & Title -->
        <div class="flex items-center gap-3">
          <a href="https://tryhackme.com" target="_blank" rel="noopener noreferrer">
            <img src="https://assets.tryhackme.com/img/logo/tryhackme_logo_full.svg" alt="THM Logo" class="h-8" />
          </a>
          <span class="text-xs bg-thmCardLight border border-thmBorder px-2.5 py-1 rounded text-thmGreen font-mono font-bold">
            TRACKER
          </span>
        </div>

        <!-- Action Controls -->
        <div class="flex items-center gap-2">
          <button 
            onclick="openModal()" 
            class="bg-thmGreen hover:bg-[#b5f247] text-slate-950 font-ubuntu font-bold text-xs px-3 py-1.5 rounded transition flex items-center gap-1.5"
          >
            <i class="fa-solid fa-user-plus text-[11px]"></i>
            <span>Update / Add Users</span>
          </button>
          
          <button 
            onclick="exportJson()" 
            class="bg-thmCardLight hover:bg-slate-700 text-slate-200 border border-thmBorder text-xs font-ubuntu font-semibold px-3 py-1.5 rounded transition flex items-center gap-1.5"
            title="Download users.json to commit to GitHub"
          >
            <i class="fa-solid fa-download text-[11px] text-thmGreen"></i>
            <span class="hidden sm:inline">Export users.json</span>
          </button>
        </div>
      </div>

      <!-- Filters & Category Selector -->
      <div class="max-w-6xl mx-auto mt-3 pt-3 border-t border-thmBorder flex flex-wrap items-center justify-between gap-3">
        <!-- Tabs -->
        <div class="flex flex-wrap items-center gap-2 text-xs font-ubuntu font-medium">
          <button 
            id="tab-bronze_league"
            onclick="switchCategory('bronze_league')" 
            class="cat-tab px-3 py-1.5 rounded bg-thmGreen/10 border border-thmGreen text-thmGreen transition"
          >
            <i class="fa-solid fa-shield-halved text-amber-500 mr-1.5"></i>Bronze League
          </button>
          <button 
            id="tab-india_monthly"
            onclick="switchCategory('india_monthly')" 
            class="cat-tab px-3 py-1.5 rounded bg-thmCardLight border border-thmBorder text-slate-300 hover:text-white transition"
          >
            <i class="fa-solid fa-calendar-days text-blue-400 mr-1.5"></i>India Monthly
          </button>
          <button 
            id="tab-india_all_time"
            onclick="switchCategory('india_all_time')" 
            class="cat-tab px-3 py-1.5 rounded bg-thmCardLight border border-thmBorder text-slate-300 hover:text-white transition"
          >
            <i class="fa-solid fa-trophy text-yellow-400 mr-1.5"></i>India All-Time
          </button>
        </div>

        <!-- Live Search -->
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <div class="relative flex-1 sm:w-64">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-thmTextMuted text-xs"></i>
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Search user, badge, rank..." 
              class="w-full bg-thmBg border border-thmBorder rounded px-8 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-thmGreen"
            />
          </div>
          <span class="bg-thmCardLight border border-thmBorder px-2.5 py-1.5 rounded text-xs font-mono text-thmTextMuted">
            <span id="userCount" class="text-thmGreen font-bold">0</span> users
          </span>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-6">
      <!-- Loading State -->
      <div id="loading" class="text-center py-20 text-thmTextMuted">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-thmGreen mb-3"></i>
        <p class="font-ubuntu text-sm">Loading users from users.json...</p>
      </div>

      <!-- Leaderboard Table -->
      <div id="tableWrapper" class="hidden bg-thmCard border border-thmBorder rounded-lg overflow-hidden shadow-lg">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-thmBorder bg-thmCardLight/60 text-[11px] font-ubuntu font-bold uppercase tracking-wider text-thmTextMuted">
                <th class="py-3 px-4 w-16 text-center">Rank</th>
                <th class="py-3 px-4">User</th>
                <th class="py-3 px-4">Badge</th>
                <th class="py-3 px-4 text-right">Points</th>
                <th id="thRooms" class="py-3 px-4 text-right">Rooms</th>
                <th class="py-3 px-4 text-center w-28">Profile</th>
              </tr>
            </thead>
            <tbody id="userRows" class="divide-y divide-thmBorder text-sm"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Upsert / Update Modal -->
  <div id="updateModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-[#1c2538] border border-thmBorder w-full max-w-lg rounded-xl p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-4 border-b border-thmBorder pb-3">
        <h3 class="text-sm font-ubuntu font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-arrows-rotate text-thmGreen"></i>
          Update or Add Users (Deduplicating)
        </h3>
        <button onclick="closeModal()" class="text-thmTextMuted hover:text-white text-base">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-thmTextMuted mb-1">Target Category:</label>
          <select id="modalCategory" class="w-full bg-thmBg border border-thmBorder rounded p-2 text-white font-ubuntu">
            <option value="bronze_league">Bronze League</option>
            <option value="india_monthly">India Monthly</option>
            <option value="india_all_time">India All-Time</option>
          </select>
        </div>

        <div>
          <label class="block text-thmTextMuted mb-1">Quick Single User Upsert:</label>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="singleUser" placeholder="Username (Unique ID)" class="bg-thmBg border border-thmBorder p-2 rounded text-white" />
            <input type="number" id="singleRank" placeholder="Rank (e.g. 1)" class="bg-thmBg border border-thmBorder p-2 rounded text-white" />
            <input type="number" id="singlePoints" placeholder="Points" class="bg-thmBg border border-thmBorder p-2 rounded text-white" />
            <input type="text" id="singleBadge" placeholder="Badge (e.g. LEGEND)" class="bg-thmBg border border-thmBorder p-2 rounded text-white" />
          </div>
          <button onclick="upsertSingle()" class="w-full mt-2 bg-thmCardLight hover:bg-slate-700 text-thmGreen border border-thmBorder py-2 rounded font-ubuntu font-bold transition">
            Save User
          </button>
        </div>

        <div class="pt-3 border-t border-thmBorder">
          <label class="block text-thmTextMuted mb-1">Or Paste Copied Text From THM:</label>
          <textarea id="rawInput" rows="4" placeholder="Paste leaderboard rows here... Existing users update automatically without duplicating!" class="w-full bg-thmBg border border-thmBorder p-2 rounded font-mono text-slate-300 text-[11px]"></textarea>
          <button onclick="parseRawInput()" class="w-full mt-2 bg-thmGreen hover:bg-[#b5f247] text-slate-950 py-2 rounded font-ubuntu font-bold transition">
            Parse & Deduplicate
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Minimal Footer -->
  <footer class="border-t border-thmBorder py-4 text-center text-xs text-thmTextMuted font-mono">
    TryHackMe Journey Tracker • Direct profile integration via <span class="text-thmGreen">tryhackme.com/p/{user}</span>
  </footer>

  <script>
    const baseUrl = "https://tryhackme.com/p/";
    let dataset = { bronze_league: [], india_monthly: [], india_all_time: [] };
    let currentCategory = "bronze_league";

    // Load Data
    async function loadData() {
      const cached = localStorage.getItem("thm_tracker_data");
      if (cached) {
        try { dataset = JSON.parse(cached); } catch(e) {}
      }

      if (!dataset.bronze_league || dataset.bronze_league.length === 0) {
        try {
          const res = await fetch("./users.json");
          if (res.ok) dataset = await res.json();
        } catch(err) {
          console.warn("Could not read users.json directly:", err);
        }
      }

      document.getElementById("loading").classList.add("hidden");
      document.getElementById("tableWrapper").classList.remove("hidden");
      render();
    }

    // Core Upsert Function: Prevents Duplicate Usernames
    function upsertUser(cat, newUser) {
      if (!dataset[cat]) dataset[cat] = [];
      const list = dataset[cat];
      const target = newUser.username.trim().toLowerCase();
      const idx = list.findIndex(u => u.username.trim().toLowerCase() === target);

      if (idx !== -1) {
        // Overwrite existing user data
        list[idx] = { ...list[idx], ...newUser };
      } else {
        // Insert new unique user
        list.push(newUser);
      }

      // Sort by rank
      list.sort((a, b) => (a.rank || 9999) - (b.rank || 9999));
      localStorage.setItem("thm_tracker_data", JSON.stringify(dataset));
    }

    function switchCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".cat-tab").forEach(tab => {
        tab.className = "cat-tab px-3 py-1.5 rounded bg-thmCardLight border border-thmBorder text-slate-300 hover:text-white transition";
      });
      document.getElementById("tab-" + cat).className = "cat-tab px-3 py-1.5 rounded bg-thmGreen/10 border border-thmGreen text-thmGreen transition";
      document.getElementById("searchInput").value = "";
      render();
    }

    function render(filter = "") {
      const list = dataset[currentCategory] || [];
      const q = filter.toLowerCase().trim();
      const filtered = list.filter(u => 
        u.username.toLowerCase().includes(q) ||
        (u.badge && u.badge.toLowerCase().includes(q)) ||
        (u.rank && u.rank.toString().includes(q))
      );

      document.getElementById("userCount").textContent = filtered.length;
      const tbody = document.getElementById("userRows");
      tbody.innerHTML = "";

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-thmTextMuted">No users match your criteria.</td></tr>`;
        return;
      }

      filtered.forEach((u, i) => {
        const profileUrl = baseUrl + encodeURIComponent(u.username);
        const rankNum = u.rank || (i + 1);

        // Podium colors for 1, 2, 3
        let rankBadge = `<span class="font-mono text-slate-400">#${rankNum}</span>`;
        if (rankNum === 1) rankBadge = `<span class="bg-amber-400/20 text-amber-400 px-2 py-0.5 rounded font-mono font-bold"><i class="fa-solid fa-crown text-[10px] mr-1"></i>1</span>`;
        if (rankNum === 2) rankBadge = `<span class="bg-slate-300/20 text-slate-300 px-2 py-0.5 rounded font-mono font-bold">2</span>`;
        if (rankNum === 3) rankBadge = `<span class="bg-amber-700/30 text-amber-500 px-2 py-0.5 rounded font-mono font-bold">3</span>`;

        const tr = document.createElement("tr");
        tr.className = "hover:bg-thmCardLight/50 transition";
        tr.innerHTML = `
          <td class="py-3 px-4 text-center font-mono">${rankBadge}</td>
          <td class="py-3 px-4">
            <a href="${profileUrl}" target="_blank" rel="noopener noreferrer" class="font-ubuntu font-bold text-white hover:text-thmGreen transition">
              ${u.username}
            </a>
          </td>
          <td class="py-3 px-4">
            ${u.badge ? `<span class="text-[11px] font-mono px-2 py-0.5 rounded bg-thmBorder text-slate-300">[${u.badge}]</span>` : '-'}
          </td>
          <td class="py-3 px-4 text-right font-mono text-slate-200 font-semibold">
            ${(u.points || 0).toLocaleString()}
          </td>
          <td class="py-3 px-4 text-right font-mono text-thmGreen">
            ${u.rooms ? u.rooms.toLocaleString() : '-'}
          </td>
          <td class="py-3 px-4 text-center">
            <div class="inline-flex items-center gap-1.5">
              <a 
                href="${profileUrl}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="p-1.5 rounded bg-thmCardLight hover:bg-thmGreen hover:text-slate-950 text-thmGreen border border-thmBorder text-xs transition"
                title="Go to THM Profile"
              >
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
              </a>
              <button 
                onclick="copyUrl('${profileUrl}', this)" 
                class="p-1.5 rounded bg-thmCardLight hover:bg-slate-700 text-slate-400 hover:text-white border border-thmBorder text-xs transition"
                title="Copy Profile URL"
              >
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function copyUrl(url, btn) {
      navigator.clipboard.writeText(url).then(() => {
        const orig = btn.innerHTML;
        btn.innerHTML = `<i class="fa-solid fa-check text-thmGreen"></i>`;
        setTimeout(() => btn.innerHTML = orig, 1200);
      });
    }

    function openModal() {
      document.getElementById("modalCategory").value = currentCategory;
      document.getElementById("updateModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("updateModal").classList.add("hidden");
    }

    function upsertSingle() {
      const username = document.getElementById("singleUser").value.trim();
      if (!username) return alert("Please enter a username.");
      const cat = document.getElementById("modalCategory").value;
      const rank = parseInt(document.getElementById("singleRank").value) || null;
      const points = parseInt(document.getElementById("singlePoints").value) || 0;
      const badge = document.getElementById("singleBadge").value.trim().toUpperCase() || null;

      upsertUser(cat, { username, rank, points, badge });
      document.getElementById("singleUser").value = "";
      document.getElementById("singleRank").value = "";
      document.getElementById("singlePoints").value = "";
      document.getElementById("singleBadge").value = "";
      closeModal();
      render();
    }

    function parseRawInput() {
      const raw = document.getElementById("rawInput").value;
      const cat = document.getElementById("modalCategory").value;
      if (!raw.trim()) return;

      const regex = /([a-zA-Z0-9_\.\-]+)\s*(?:\[0x[0-9A-Fa-f]+\])?\[([A-Z]+)\]/g;
      let match;
      let count = 0;

      while ((match = regex.exec(raw)) !== null) {
        const username = match[1];
        const badge = match[2];
        const snippet = raw.substring(match.index, match.index + 200);
        const pt = snippet.match(/(?:Points:?\s*|Points\n+)?(\d{2,7})/i);
        const points = pt ? parseInt(pt[1]) : 0;

        upsertUser(cat, { username, badge, points });
        count++;
      }

      alert(`Updated & deduplicated ${count} entries into ${cat}!`);
      document.getElementById("rawInput").value = "";
      closeModal();
      render();
    }

    function exportJson() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataset, null, 2));
      const a = document.createElement("a");
      a.href = dataStr;
      a.download = "users.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    document.getElementById("searchInput").addEventListener("input", (e) => render(e.target.value));

    loadData();
  </script>
</body>
</html>
