<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TryHackMe Journey & Leaderboard Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            thmGreen: '#10b981',
            thmDark: '#0f172a',
            thmCard: '#1e293b',
            thmBorder: '#334155'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-thmDark text-slate-100 min-h-screen font-sans flex flex-col justify-between">
  
  <div>
    <!-- Sticky Header -->
    <header class="border-b border-thmBorder bg-slate-900/90 sticky top-0 backdrop-blur z-20 px-6 py-4">
      <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <span class="p-2.5 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xl font-mono">
            <i class="fa-solid fa-terminal"></i>
          </span>
          <div>
            <h1 class="text-xl font-bold tracking-wide">TryHackMe Profile Tracker</h1>
            <p class="text-xs text-slate-400">Direct profile navigation & benchmark directory</p>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <div class="relative flex-1 sm:w-72">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Search user, rank, badge..." 
              class="w-full pl-9 pr-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:border-emerald-500 text-white"
            />
          </div>
          <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-mono">
            Count: <span id="userCount" class="text-emerald-400 font-bold">0</span>
          </div>
        </div>
      </div>

      <!-- Category Navigation Tabs -->
      <div class="max-w-6xl mx-auto mt-4 pt-3 border-t border-slate-800 flex flex-wrap items-center gap-2">
        <button 
          id="tab-bronze_league"
          onclick="switchCategory('bronze_league')" 
          class="cat-tab px-4 py-1.5 rounded-lg text-xs font-semibold border border-emerald-500 bg-emerald-500/10 text-emerald-400 transition"
        >
          <i class="fa-solid fa-shield-halved mr-1.5 text-amber-500"></i>Bronze League (30)
        </button>
        <button 
          id="tab-india_monthly"
          onclick="switchCategory('india_monthly')" 
          class="cat-tab px-4 py-1.5 rounded-lg text-xs font-semibold border border-slate-700 bg-slate-800 text-slate-400 hover:text-white transition"
        >
          <i class="fa-solid fa-calendar-days mr-1.5 text-blue-400"></i>India Monthly (Top 50)
        </button>
        <button 
          id="tab-india_all_time"
          onclick="switchCategory('india_all_time')" 
          class="cat-tab px-4 py-1.5 rounded-lg text-xs font-semibold border border-slate-700 bg-slate-800 text-slate-400 hover:text-white transition"
        >
          <i class="fa-solid fa-trophy mr-1.5 text-yellow-400"></i>India All-Time (Top 50)
        </button>
      </div>
    </header>

    <!-- Content Grid -->
    <main class="max-w-6xl mx-auto px-6 py-8">
      <div id="loading" class="text-center py-20 text-slate-400">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-emerald-400 mb-3"></i>
        <p>Loading profiles from users.json...</p>
      </div>

      <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 hidden"></div>
    </main>
  </div>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    TryHackMe Journey Tracker • Direct profile integration via <code class="text-slate-400">tryhackme.com/p/{username}</code>
  </footer>

  <script>
    const baseUrl = "https://tryhackme.com/p/";
    let dataset = { bronze_league: [], india_monthly: [], india_all_time: [] };
    let currentCategory = "bronze_league";

    async function loadData() {
      try {
        const response = await fetch("./users.json");
        if (!response.ok) throw new Error("users.json fetch error");
        dataset = await response.json();
      } catch (err) {
        console.warn("Could not read users.json directly:", err);
      }

      document.getElementById("loading").classList.add("hidden");
      document.getElementById("cardsGrid").classList.remove("hidden");
      renderCurrentList();
    }

    function switchCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".cat-tab").forEach(tab => {
        tab.className = "cat-tab px-4 py-1.5 rounded-lg text-xs font-semibold border border-slate-700 bg-slate-800 text-slate-400 hover:text-white transition";
      });

      const activeTab = document.getElementById("tab-" + cat);
      if (activeTab) {
        activeTab.className = "cat-tab px-4 py-1.5 rounded-lg text-xs font-semibold border border-emerald-500 bg-emerald-500/10 text-emerald-400 transition";
      }

      document.getElementById("searchInput").value = "";
      renderCurrentList();
    }

    function renderCurrentList(filterText = "") {
      const activeList = dataset[currentCategory] || [];
      const q = filterText.toLowerCase().trim();

      const filtered = activeList.filter(u => 
        u.username.toLowerCase().includes(q) ||
        (u.badge && u.badge.toLowerCase().includes(q)) ||
        (u.rank && u.rank.toString().includes(q))
      );

      const grid = document.getElementById("cardsGrid");
      const countEl = document.getElementById("userCount");
      countEl.textContent = filtered.length;
      grid.innerHTML = "";

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center text-slate-500 py-16">No users matching search.</div>`;
        return;
      }

      filtered.forEach((u, index) => {
        const profileUrl = baseUrl + encodeURIComponent(u.username);
        const card = document.createElement("div");
        card.className = "bg-thmCard border border-thmBorder hover:border-emerald-500/40 rounded-xl p-4 transition-all duration-200 hover:-translate-y-1 hover:shadow-lg flex flex-col justify-between";

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300">
                #${u.rank || (index + 1)}
              </span>
              ${u.badge ? `
                <span class="text-[10px] font-bold tracking-wider px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-mono">
                  [${u.badge}]
                </span>
              ` : ''}
            </div>

            <h3 class="font-bold text-base text-white truncate" title="${u.username}">
              ${u.username}
            </h3>

            <div class="mt-2 space-y-1 text-xs text-slate-400">
              <div class="flex items-center justify-between">
                <span class="text-slate-500">Points:</span>
                <span class="text-slate-200 font-mono font-semibold">${(u.points || 0).toLocaleString()}</span>
              </div>
              ${u.rooms ? `
                <div class="flex items-center justify-between">
                  <span class="text-slate-500">Rooms:</span>
                  <span class="text-emerald-400 font-mono font-semibold">${u.rooms.toLocaleString()}</span>
                </div>
              ` : ''}
            </div>
          </div>

          <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between gap-2">
            <a 
              href="${profileUrl}" 
              target="_blank" 
              rel="noopener noreferrer" 
              class="flex-1 inline-flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold px-3 py-1.5 rounded-lg text-xs transition-colors"
            >
              <span>View Profile</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
            <button 
              onclick="copyLink('${profileUrl}', this)" 
              class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs border border-slate-700 transition" 
              title="Copy Profile URL"
            >
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function copyLink(url, btn) {
      navigator.clipboard.writeText(url).then(() => {
        const originalHtml = btn.innerHTML;
        btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i>`;
        setTimeout(() => btn.innerHTML = originalHtml, 1500);
      });
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderCurrentList(e.target.value);
    });

    loadData();
  </script>
</body>
</html>
